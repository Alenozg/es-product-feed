name: Build product feed

on:
  schedule:
    # Merchant Center beslemeyi her gece 00:08 (TR) çekiyor; GitHub zamanlaması saatlerce gecikebildiği için
    # 21:00 (TR) çalışması o çekimden önce güncel listeyi hazırlar. 06:00 (TR) çalışması gün içi değişiklikler için kalır.
    - cron: "0 18 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node build-feed.mjs
      - run: |
          git config user.name "es-feed-bot"
          git config user.email "actions@github.com"
          git add docs/feed.xml
          git diff --staged --quiet || git commit -m "Update product feed"
          git push
