name: Build product feed

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node build-feed.mjs
      - run: |
          git config user.name "es-feed-bot"
          git config user.email "actions@github.com"
          git add docs/feed.xml
          git diff --staged --quiet || git commit -m "Update product feed"
          git push
